<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Enter Marks</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-success px-4">
    <a href="/teacher/dashboard" class="navbar-brand">← Dashboard</a>
    <form th:action="@{/logout}" method="post" class="d-inline">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-danger btn-sm">Logout</button>
    </form>
</nav>
<div class="container mt-4">
    <h5>Enter Marks — <span th:text="${subject.name}"></span></h5>
    <p class="text-muted">
        Max Marks: <span th:text="${subject.maxMarks}"></span>
        | Passing Marks: <span th:text="${subject.passingMarks}"></span>
    </p>
    <table class="table table-bordered bg-white">
        <thead class="table-dark">
        <tr>
            <th>Roll No</th>
            <th>Student Name</th>
            <th>Marks Obtained</th>
            <th>Grade</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${students}">
            <td th:text="${s.rollNumber}"></td>
            <td th:text="${s.user.name}"></td>
            <td>
                <form th:action="@{/teacher/marks/save}" method="post"
                      class="d-flex gap-2 align-items-center">
                    <input type="hidden" name="studentId" th:value="${s.id}">
                    <input type="hidden" name="subjectId" th:value="${subject.id}">
                    <input type="number" name="marksObtained"
                           class="form-control form-control-sm"
                           style="width: 100px"
                           min="0" th:max="${subject.maxMarks}" required>
                    <button class="btn btn-sm btn-primary">Save</button>
                </form>
            </td>
            <td>
                    <span th:each="r : ${results}" th:if="${r.student.id == s.id}"
                          th:text="${r.grade}"></span>
            </td>
            <td>
                    <span th:each="r : ${results}" th:if="${r.student.id == s.id}"
                          th:text="${r.isPassed ? 'Pass' : 'Fail'}"
                          th:class="${r.isPassed} ? 'badge bg-success' : 'badge bg-danger'">
                    </span>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
