<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Enter Marks</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/teacher-dark.css}">
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-logo">👨‍🏫</div>
        <div>
            <h5>Teacher Portal</h5>
            <p>Marks Entry</p>
        </div>
    </div>
    <div class="sidebar-nav">
        <a href="/teacher/dashboard">
            <span class="nav-icon">📊</span> Dashboard
        </a>
    </div>
    <div class="sidebar-footer">
        <form th:action="@{/logout}" method="post">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}"/>
            <button type="submit">🚪 Logout</button>
        </form>
    </div>
</div>

<div class="top-navbar">
    <div class="navbar-left">
        <h6 th:text="${subject.name + ' — Marks Entry'}">Marks Entry</h6>
        <p th:text="${subject.classRoom.name + ' Section '
                   + subject.classRoom.section
                   + ' — ' + subject.classRoom.academicYear}"></p>
    </div>
    <div class="navbar-right">
        <a href="/teacher/dashboard"
           style="font-size:13px;color:#34d399;text-decoration:none;">
            ← Back to Dashboard
        </a>
    </div>
</div>

<div class="main-content">

    <!-- Subject Info Banner -->
    <div class="welcome-banner" style="margin-bottom:24px; padding:20px 28px;">
        <div class="welcome-left">
            <h4 th:text="${subject.name}">Subject</h4>
            <p th:text="${subject.classRoom.name
                       + ' — Section ' + subject.classRoom.section}"></p>
        </div>
        <div style="display:flex; gap:16px; position:relative; z-index:1;">
            <div style="text-align:center; background:rgba(255,255,255,0.1);
                        border-radius:10px; padding:10px 20px;">
                <div style="font-size:22px; font-weight:700;"
                     th:text="${subject.maxMarks}"></div>
                <div style="font-size:11px; opacity:0.75;">Max Marks</div>
            </div>
            <div style="text-align:center; background:rgba(255,255,255,0.1);
                        border-radius:10px; padding:10px 20px;">
                <div style="font-size:22px; font-weight:700;"
                     th:text="${subject.passingMarks}"></div>
                <div style="font-size:11px; opacity:0.75;">Pass Marks</div>
            </div>
            <div style="text-align:center; background:rgba(255,255,255,0.1);
                        border-radius:10px; padding:10px 20px;">
                <div style="font-size:22px; font-weight:700;"
                     th:text="${students.size()}"></div>
                <div style="font-size:11px; opacity:0.75;">Students</div>
            </div>
        </div>
    </div>

    <!-- Marks Table -->
    <div class="dark-card">
        <div class="dark-card-header">
            <h5>🎓 Enter Student Marks</h5>
            <span style="font-size:11px; color:rgba(255,255,255,0.3);">
                Save each student individually
            </span>
        </div>
        <table class="dark-table">
            <thead>
            <tr>
                <th>#</th>
                <th>Student</th>
                <th>Roll No</th>
                <th>Enter Marks</th>
                <th>Grade</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s, i : ${students}">
                <td style="color:rgba(255,255,255,0.3);"
                    th:text="${i.count}"></td>
                <td style="color:white; font-weight:500;"
                    th:text="${s.user.name}"></td>
                <td>
                        <span class="badge-grade"
                              th:text="${s.rollNumber}"></span>
                </td>
                <td>
                    <form th:action="@{/teacher/marks/save}"
                          method="post"
                          class="d-flex align-items-center gap-2">
                        <input type="hidden" name="studentId"
                               th:value="${s.id}">
                        <input type="hidden" name="subjectId"
                               th:value="${subject.id}">
                        <input type="number"
                               name="marksObtained"
                               class="marks-input"
                               th:value="${resultMap[s.id] != null ?
                                       resultMap[s.id].marksObtained : ''}"
                               min="0"
                               th:max="${subject.maxMarks}"
                               required>
                        <button class="save-btn">Save</button>
                    </form>
                </td>
                <td>
                        <span th:if="${resultMap[s.id] != null}"
                              class="badge-grade"
                              th:text="${resultMap[s.id].grade}">
                        </span>
                </td>
                <td>
                        <span th:if="${resultMap[s.id] != null}">
                            <span th:if="${resultMap[s.id].isPassed}"
                                  class="badge-pass">Pass</span>
                            <span th:if="${!resultMap[s.id].isPassed}"
                                  class="badge-fail">Fail</span>
                        </span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
