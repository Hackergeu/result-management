<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .welcome-card {
            background: linear-gradient(135deg, #065f46 0%, #059669 50%, #34d399 100%);
            border-radius: 16px;
            padding: 28px 32px;
            color: white;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        .welcome-card::before {
            content: '';
            position: absolute;
            width: 200px; height: 200px;
            background: rgba(255,255,255,0.07);
            border-radius: 50%;
            top: -60px; right: 80px;
        }
        .welcome-card::after {
            content: '';
            position: absolute;
            width: 150px; height: 150px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            bottom: -40px; right: 20px;
        }
        .welcome-left h4 {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 6px;
        }
        .welcome-left p {
            font-size: 14px;
            opacity: 0.85;
            margin: 0;
        }
        .welcome-right {
            font-size: 64px;
            position: relative;
            z-index: 1;
        }

        .mini-stat {
            background: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .mini-stat-icon {
            width: 40px; height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .mini-stat-info h5 {
            font-size: 20px;
            font-weight: 700;
            color: #1e293b;
            margin: 0 0 2px;
        }
        .mini-stat-info p {
            font-size: 12px;
            color: #64748b;
            margin: 0;
        }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #1e293b;
            margin: 0 0 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .subject-card {
            background: white;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            height: 100%;
        }
        .subject-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        .subject-card-top {
            padding: 20px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }
        .subject-icon {
            width: 46px; height: 46px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }
        .subject-info h6 {
            font-size: 15px;
            font-weight: 600;
            color: #1e293b;
            margin: 0 0 5px;
        }
        .subject-info p {
            font-size: 12px;
            color: #64748b;
            margin: 0 0 3px;
        }
        .subject-card-footer {
            padding: 12px 20px;
            border-top: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .subject-card-footer span {
            font-size: 11px;
            color: #94a3b8;
        }
        .enter-marks-btn {
            font-size: 12px;
            font-weight: 600;
            padding: 7px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.15s;
            display: inline-block;
            color: white;
        }
        .enter-marks-btn:hover {
            opacity: 0.85;
            color: white;
            text-decoration: none;
        }

        .color-0 .subject-card-top { background: #eff6ff; }
        .color-0 .subject-icon { background: #dbeafe; }
        .color-0 .enter-marks-btn { background: #1e3a8a; }

        .color-1 .subject-card-top { background: #f0fdf4; }
        .color-1 .subject-icon { background: #dcfce7; }
        .color-1 .enter-marks-btn { background: #065f46; }

        .color-2 .subject-card-top { background: #fdf4ff; }
        .color-2 .subject-icon { background: #f3e8ff; }
        .color-2 .enter-marks-btn { background: #6d28d9; }

        .color-3 .subject-card-top { background: #fff7ed; }
        .color-3 .subject-icon { background: #ffedd5; }
        .color-3 .enter-marks-btn { background: #c2410c; }

        .color-4 .subject-card-top { background: #fdf2f8; }
        .color-4 .subject-icon { background: #fce7f3; }
        .color-4 .enter-marks-btn { background: #9d174d; }

        .color-5 .subject-card-top { background: #f0fdfa; }
        .color-5 .subject-icon { background: #ccfbf1; }
        .color-5 .enter-marks-btn { background: #0f766e; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
            background: white;
            border-radius: 14px;
            border: 1px dashed #e2e8f0;
        }
        .empty-state .empty-icon { font-size: 52px; margin-bottom: 14px; }
        .empty-state p { font-size: 14px; margin: 0; }
    </style>
</head>
<body>

<div class="sidebar sidebar-teacher">
    <div class="sidebar-header">
        <h5>Teacher Portal</h5>
        <p th:text="${teacher.user.name}">Teacher</p>
    </div>
    <div class="sidebar-nav">
        <a href="/teacher/dashboard" class="active">Dashboard</a>
    </div>
    <div class="sidebar-footer">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit">Logout</button>
        </form>
    </div>
</div>

<div class="main-content">

    <!-- Welcome Banner -->
    <div class="welcome-card">
        <div class="welcome-left">
            <h4>Good day, <span th:text="${teacher.user.name}">Teacher</span>!</h4>
            <p th:text="${teacher.department + ' Department'}"></p>
            <p style="margin-top:8px; font-size:13px; opacity:0.75;">
                Employee Code:
                <strong th:text="${teacher.employeeCode}"></strong>
            </p>
        </div>
        <div class="welcome-right">👨‍🏫</div>
    </div>

    <!-- Mini Stats -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="mini-stat">
                <div class="mini-stat-icon" style="background:#eff6ff;">📚</div>
                <div class="mini-stat-info">
                    <h5 th:text="${subjects.size()}">0</h5>
                    <p>Subjects Assigned</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="mini-stat">
                <div class="mini-stat-icon" style="background:#f0fdf4;">🎓</div>
                <div class="mini-stat-info">
                    <h5 th:text="${totalStudents}">0</h5>
                    <p>Students Taught</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="mini-stat">
                <div class="mini-stat-icon" style="background:#fdf4ff;">✅</div>
                <div class="mini-stat-info">
                    <h5 th:text="${totalMarksEntered}">0</h5>
                    <p>Marks Entered</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Subjects Section -->
    <p class="section-title">Your Subjects</p>

    <!-- Empty state -->
    <div th:if="${subjects.isEmpty()}" class="empty-state">
        <div class="empty-icon">📭</div>
        <p>No subjects assigned yet.<br>Contact admin to get subjects assigned.</p>
    </div>

    <!-- Subject Cards -->
    <div class="row g-3" th:if="${!subjects.isEmpty()}">
        <div class="col-md-4" th:each="s, i : ${subjects}">
            <div class="subject-card" th:classappend="'color-' + ${i.index % 6}">
                <div class="subject-card-top">
                    <div class="subject-icon">
                        <span th:if="${#strings.containsIgnoreCase(s.name,'math')}">📐</span>
                        <span th:if="${#strings.containsIgnoreCase(s.name,'science')}">🔬</span>
                        <span th:if="${#strings.containsIgnoreCase(s.name,'english')}">📖</span>
                        <span th:if="${#strings.containsIgnoreCase(s.name,'history')}">🏛️</span>
                        <span th:if="${#strings.containsIgnoreCase(s.name,'physics')}">⚛️</span>
                        <span th:if="${#strings.containsIgnoreCase(s.name,'chemistry')}">🧪</span>
                        <span th:if="${#strings.containsIgnoreCase(s.name,'bio')}">🌿</span>
                        <span th:if="${#strings.containsIgnoreCase(s.name,'computer')}">💻</span>
                        <span th:if="${#strings.containsIgnoreCase(s.name,'geo')}">🌍</span>
                        <span th:unless="${
                            #strings.containsIgnoreCase(s.name,'math') or
                            #strings.containsIgnoreCase(s.name,'science') or
                            #strings.containsIgnoreCase(s.name,'english') or
                            #strings.containsIgnoreCase(s.name,'history') or
                            #strings.containsIgnoreCase(s.name,'physics') or
                            #strings.containsIgnoreCase(s.name,'chemistry') or
                            #strings.containsIgnoreCase(s.name,'bio') or
                            #strings.containsIgnoreCase(s.name,'computer') or
                            #strings.containsIgnoreCase(s.name,'geo')}">📝</span>
                    </div>
                    <div class="subject-info">
                        <h6 th:text="${s.name}"></h6>
                        <p th:text="${s.classRoom.name + ' — Section ' + s.classRoom.section}"></p>
                        <p>Max: <strong th:text="${s.maxMarks}"></strong>
                            &nbsp;|&nbsp;
                            Pass: <strong th:text="${s.passingMarks}"></strong>
                        </p>
                    </div>
                </div>
                <div class="subject-card-footer">
                    <span th:text="${s.classRoom.academicYear}"></span>
                    <a th:href="@{/teacher/marks/{id}(id=${s.id})}"
                       class="enter-marks-btn">
                        Enter Marks →
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
