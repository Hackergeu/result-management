<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Teacher Dashboard</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/teacher-dark.css}">
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-logo">👨‍🏫</div>
        <div>
            <h5>Teacher Portal</h5>
            <p th:text="${teacher.user.name}">Teacher</p>
        </div>
    </div>
    <div class="sidebar-nav">
        <a href="/teacher/dashboard" class="active">
            <span class="nav-icon">📊</span> Dashboard
        </a>
    </div>
    <div class="sidebar-footer">
        <form th:action="@{/logout}" method="post">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}"/>
            <button type="submit">🚪 Logout</button>
        </form>
    </div>
</div>

<div class="top-navbar">
    <div class="navbar-left">
        <h6 th:text="'Welcome back, ' + ${teacher.user.name} + '! 👋'">Welcome!</h6>
        <p th:text="${teacher.department + ' Department — Employee Code: ' + teacher.employeeCode}"></p>
    </div>
    <div class="navbar-right">
        <div class="teacher-profile">
            <div class="teacher-avatar">👨‍🏫</div>
            <span th:text="${teacher.user.name}">Teacher</span>
        </div>
    </div>
</div>

<div class="main-content">

    <!-- Welcome Banner -->
    <div class="welcome-banner">
        <div class="welcome-left">
            <h4>Good day, <span th:text="${teacher.user.name}">Teacher</span>! 👋</h4>
            <p th:text="${teacher.department + ' Department'}"></p>
            <p style="font-size:13px;opacity:0.7;">
                Employee Code:
                <strong th:text="${teacher.employeeCode}"></strong>
            </p>
        </div>
        <div class="welcome-right">👨‍🏫</div>
    </div>

    <!-- Mini Stats -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="mini-stat">
                <div class="mini-stat-icon si-green">📚</div>
                <div class="mini-stat-info">
                    <h5 th:text="${subjects.size()}">0</h5>
                    <p>Subjects Assigned</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="mini-stat">
                <div class="mini-stat-icon si-teal">🎓</div>
                <div class="mini-stat-info">
                    <h5 th:text="${totalStudents}">0</h5>
                    <p>Students Taught</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="mini-stat">
                <div class="mini-stat-icon si-emerald">✅</div>
                <div class="mini-stat-info">
                    <h5 th:text="${totalMarksEntered}">0</h5>
                    <p>Marks Entered</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Subjects Section -->
    <p class="section-title">📚 Your Subjects</p>

    <div th:if="${subjects.isEmpty()}" class="dark-empty">
        <div class="empty-icon">📭</div>
        <p>No subjects assigned yet. Contact admin.</p>
    </div>

    <div class="row g-3" th:if="${!subjects.isEmpty()}">
        <div class="col-md-4" th:each="s, i : ${subjects}">
            <div class="subject-card">
                <div class="subject-card-top">
                    <div class="subject-icon">
                        <span th:if="${#strings.containsIgnoreCase(s.name,'math')}">📐</span>
                        <span th:if="${#strings.containsIgnoreCase(s.name,'science')}">🔬</span>
                        <span th:if="${#strings.containsIgnoreCase(s.name,'english')}">📖</span>
                        <span th:if="${#strings.containsIgnoreCase(s.name,'history')}">🏛️</span>
                        <span th:if="${#strings.containsIgnoreCase(s.name,'physics')}">⚛️</span>
                        <span th:if="${#strings.containsIgnoreCase(s.name,'chemistry')}">🧪</span>
                        <span th:if="${#strings.containsIgnoreCase(s.name,'bio')}">🌿</span>
                        <span th:if="${#strings.containsIgnoreCase(s.name,'computer')}">💻</span>
                        <span th:if="${#strings.containsIgnoreCase(s.name,'geo')}">🌍</span>
                        <span th:unless="${
                            #strings.containsIgnoreCase(s.name,'math') or
                            #strings.containsIgnoreCase(s.name,'science') or
                            #strings.containsIgnoreCase(s.name,'english') or
                            #strings.containsIgnoreCase(s.name,'history') or
                            #strings.containsIgnoreCase(s.name,'physics') or
                            #strings.containsIgnoreCase(s.name,'chemistry') or
                            #strings.containsIgnoreCase(s.name,'bio') or
                            #strings.containsIgnoreCase(s.name,'computer') or
                            #strings.containsIgnoreCase(s.name,'geo')}">📝</span>
                    </div>
                    <div class="subject-info">
                        <h6 th:text="${s.name}"></h6>
                        <p th:text="${s.classRoom.name + ' — Section ' + s.classRoom.section}"></p>
                        <p>Max: <strong style="color:#34d399;"
                                        th:text="${s.maxMarks}"></strong>
                            &nbsp;|&nbsp;
                            Pass: <strong style="color:#34d399;"
                                          th:text="${s.passingMarks}"></strong>
                        </p>
                    </div>
                </div>
                <div class="subject-card-footer">
                    <span th:text="${s.classRoom.academicYear}"></span>
                    <a th:href="@{/teacher/marks/{id}(id=${s.id})}"
                       class="enter-marks-btn">
                        Enter Marks →
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
