<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Classes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="sidebar sidebar-admin">
    <div class="sidebar-header">
        <h5>School Result System</h5>
        <p>Admin Panel</p>
    </div>
    <div class="sidebar-nav">
        <a href="/admin/dashboard">Dashboard</a>
        <a href="/admin/classes" class="active">Classes</a>
        <a href="/admin/teachers">Teachers</a>
        <a href="/admin/students">Students</a>
        <a href="/admin/subjects">Subjects</a>
    </div>
    <div class="sidebar-footer">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit">Logout</button>
        </form>
    </div>
</div>

<div class="main-content">
    <div class="page-header">
        <h4>Classes</h4>
        <p>Manage classroom sections and academic years.</p>
    </div>
    <div class="row g-4">
        <div class="col-md-4">
            <div class="content-card">
                <div class="content-card-header"><h5>Add New Class</h5></div>
                <div class="content-card-body">
                    <form th:action="@{/admin/classes/save}"
                          th:object="${classRoom}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Class Name</label>
                            <input th:field="*{name}" class="form-control"
                                   placeholder="e.g. Class 10" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Section</label>
                            <input th:field="*{section}" class="form-control"
                                   placeholder="e.g. A" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Academic Year</label>
                            <input th:field="*{academicYear}" class="form-control"
                                   placeholder="e.g. 2024-25" required>
                        </div>
                        <button class="btn btn-primary w-100">Save Class</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="content-card">
                <div class="content-card-header"><h5>All Classes</h5></div>
                <table class="table">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Section</th>
                        <th>Academic Year</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c, i : ${classes}">
                        <td th:text="${i.count}"></td>
                        <td th:text="${c.name}"></td>
                        <td th:text="${c.section}"></td>
                        <td th:text="${c.academicYear}"></td>
                        <td>
                            <a th:href="@{/admin/classes/delete/{id}(id=${c.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Delete this class?')">Delete</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
