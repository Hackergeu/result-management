<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Classes</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-dark.css}">
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-logo">🏫</div>
        <div><h5>School System</h5><p>Admin Panel</p></div>
    </div>
    <div class="sidebar-nav">
        <a href="/admin/dashboard"><span class="nav-icon">📊</span> Dashboard</a>
        <a href="/admin/classes" class="active"><span class="nav-icon">🏫</span> Classes</a>
        <a href="/admin/teachers"><span class="nav-icon">👨‍🏫</span> Teachers</a>
        <a href="/admin/students"><span class="nav-icon">🎓</span> Students</a>
        <a href="/admin/subjects"><span class="nav-icon">📚</span> Subjects</a>
    </div>
    <div class="sidebar-footer">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit">🚪 Logout</button>
        </form>
    </div>
</div>

<div class="top-navbar">
    <div class="navbar-left">
        <h6>Classes</h6>
        <p>Manage classroom sections and academic years</p>
    </div>
    <div class="navbar-right">
        <div class="admin-profile">
            <div class="admin-avatar">👤</div>
            <span>Admin</span>
        </div>
    </div>
</div>

<div class="main-content">
    <div class="row g-4">
        <div class="col-md-4">
            <div class="dark-card">
                <div class="dark-card-header"><h5>➕ Add New Class</h5></div>
                <div class="dark-card-body">
                    <form th:action="@{/admin/classes/save}"
                          th:object="${classRoom}" method="post">
                        <div class="mb-3">
                            <label class="dark-form-label">Class Name</label>
                            <input th:field="*{name}" class="dark-input"
                                   placeholder="e.g. Class 10" required>
                        </div>
                        <div class="mb-3">
                            <label class="dark-form-label">Section</label>
                            <input th:field="*{section}" class="dark-input"
                                   placeholder="e.g. A" required>
                        </div>
                        <div class="mb-3">
                            <label class="dark-form-label">Academic Year</label>
                            <input th:field="*{academicYear}" class="dark-input"
                                   placeholder="e.g. 2024-25" required>
                        </div>
                        <button class="btn-dark-primary">Save Class</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="dark-card">
                <div class="dark-card-header">
                    <h5>🏫 All Classes</h5>
                    <span style="font-size:12px;color:rgba(255,255,255,0.3);"
                          th:text="${classes.size() + ' total'}"></span>
                </div>
                <table class="dark-table">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Class Name</th>
                        <th>Section</th>
                        <th>Academic Year</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c, i : ${classes}">
                        <td style="color:rgba(255,255,255,0.3);"
                            th:text="${i.count}"></td>
                        <td style="color:white;font-weight:500;"
                            th:text="${c.name}"></td>
                        <td><span class="badge-grade"
                                  th:text="${c.section}"></span></td>
                        <td th:text="${c.academicYear}"></td>
                        <td>
                            <a th:href="@{/admin/classes/delete/{id}(id=${c.id})}"
                               class="btn-dark-danger"
                               onclick="return confirm('Delete this class?')">Delete</a>
                        </td>
                    </tr>
                    <tr th:if="${classes.isEmpty()}">
                        <td colspan="5">
                            <div class="dark-empty">
                                <div class="empty-icon">📭</div>
                                <p>No classes added yet</p>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
