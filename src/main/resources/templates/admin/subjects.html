<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Subjects</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-dark.css}">
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-logo">🏫</div>
        <div><h5>School System</h5><p>Admin Panel</p></div>
    </div>
    <div class="sidebar-nav">
        <a href="/admin/dashboard"><span class="nav-icon">📊</span> Dashboard</a>
        <a href="/admin/classes"><span class="nav-icon">🏫</span> Classes</a>
        <a href="/admin/teachers"><span class="nav-icon">👨‍🏫</span> Teachers</a>
        <a href="/admin/students"><span class="nav-icon">🎓</span> Students</a>
        <a href="/admin/subjects" class="active"><span class="nav-icon">📚</span> Subjects</a>
    </div>
    <div class="sidebar-footer">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit">🚪 Logout</button>
        </form>
    </div>
</div>

<div class="top-navbar">
    <div class="navbar-left">
        <h6>Subjects</h6>
        <p>Manage subjects and assign teachers</p>
    </div>
    <div class="navbar-right">
        <div class="admin-profile">
            <div class="admin-avatar">👤</div>
            <span>Admin</span>
        </div>
    </div>
</div>

<div class="main-content">
    <div class="row g-4">
        <div class="col-md-4">
            <div class="dark-card">
                <div class="dark-card-header"><h5>➕ Add New Subject</h5></div>
                <div class="dark-card-body">
                    <form th:action="@{/admin/subjects/save}" method="post">
                        <div class="mb-3">
                            <label class="dark-form-label">Subject Name</label>
                            <input name="name" class="dark-input" required>
                        </div>
                        <div class="mb-3">
                            <label class="dark-form-label">Max Marks</label>
                            <input name="maxMarks" type="number"
                                   class="dark-input" placeholder="e.g. 100" required>
                        </div>
                        <div class="mb-3">
                            <label class="dark-form-label">Passing Marks</label>
                            <input name="passingMarks" type="number"
                                   class="dark-input" placeholder="e.g. 35" required>
                        </div>
                        <div class="mb-3">
                            <label class="dark-form-label">Class</label>
                            <select name="classRoomId" class="dark-input" required>
                                <option value="">-- Select Class --</option>
                                <option th:each="c : ${classes}"
                                        th:value="${c.id}"
                                        th:text="${c.name + ' ' + c.section}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="dark-form-label">Teacher</label>
                            <select name="teacherId" class="dark-input" required>
                                <option value="">-- Select Teacher --</option>
                                <option th:each="t : ${teachers}"
                                        th:value="${t.id}"
                                        th:text="${t.user.name}"></option>
                            </select>
                        </div>
                        <button class="btn-dark-primary">Add Subject</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="dark-card">
                <div class="dark-card-header">
                    <h5>📚 All Subjects</h5>
                    <span style="font-size:12px;color:rgba(255,255,255,0.3);"
                          th:text="${subjects.size() + ' total'}"></span>
                </div>
                <table class="dark-table">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Subject</th>
                        <th>Class</th>
                        <th>Teacher</th>
                        <th>Max</th>
                        <th>Pass</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="s, i : ${subjects}">
                        <td style="color:rgba(255,255,255,0.3);"
                            th:text="${i.count}"></td>
                        <td style="color:white;font-weight:500;"
                            th:text="${s.name}"></td>
                        <td th:text="${s.classRoom.name + ' ' + s.classRoom.section}"></td>
                        <td th:text="${s.teacher.user.name}"></td>
                        <td><span class="badge-grade"
                                  th:text="${s.maxMarks}"></span></td>
                        <td><span class="badge-pass"
                                  th:text="${s.passingMarks}"></span></td>
                        <td>
                            <a th:href="@{/admin/subjects/delete/{id}(id=${s.id})}"
                               class="btn-dark-danger"
                               onclick="return confirm('Delete this subject?')">Delete</a>
                        </td>
                    </tr>
                    <tr th:if="${subjects.isEmpty()}">
                        <td colspan="7">
                            <div class="dark-empty">
                                <div class="empty-icon">📭</div>
                                <p>No subjects added yet</p>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
