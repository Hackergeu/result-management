<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Subjects</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="sidebar sidebar-admin">
    <div class="sidebar-header">
        <h5>School Result System</h5>
        <p>Admin Panel</p>
    </div>
    <div class="sidebar-nav">
        <a href="/admin/dashboard">Dashboard</a>
        <a href="/admin/classes">Classes</a>
        <a href="/admin/teachers">Teachers</a>
        <a href="/admin/students">Students</a>
        <a href="/admin/subjects" class="active">Subjects</a>
    </div>
    <div class="sidebar-footer">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit">Logout</button>
        </form>
    </div>
</div>

<div class="main-content">
    <div class="page-header">
        <h4>Subjects</h4>
        <p>Manage subjects, assign teachers and classes.</p>
    </div>
    <div class="row g-4">
        <div class="col-md-4">
            <div class="content-card">
                <div class="content-card-header"><h5>Add New Subject</h5></div>
                <div class="content-card-body">
                    <form th:action="@{/admin/subjects/save}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Subject Name</label>
                            <input name="name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Max Marks</label>
                            <input name="maxMarks" type="number"
                                   class="form-control" placeholder="e.g. 100" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Passing Marks</label>
                            <input name="passingMarks" type="number"
                                   class="form-control" placeholder="e.g. 35" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Class</label>
                            <select name="classRoomId" class="form-select" required>
                                <option value="">-- Select Class --</option>
                                <option th:each="c : ${classes}"
                                        th:value="${c.id}"
                                        th:text="${c.name + ' ' + c.section}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Teacher</label>
                            <select name="teacherId" class="form-select" required>
                                <option value="">-- Select Teacher --</option>
                                <option th:each="t : ${teachers}"
                                        th:value="${t.id}"
                                        th:text="${t.user.name}"></option>
                            </select>
                        </div>
                        <button class="btn btn-primary w-100">Add Subject</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="content-card">
                <div class="content-card-header"><h5>All Subjects</h5></div>
                <table class="table">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Subject</th>
                        <th>Class</th>
                        <th>Teacher</th>
                        <th>Max Marks</th>
                        <th>Pass Marks</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="s, i : ${subjects}">
                        <td th:text="${i.count}"></td>
                        <td th:text="${s.name}"></td>
                        <td th:text="${s.classRoom.name + ' ' + s.classRoom.section}"></td>
                        <td th:text="${s.teacher.user.name}"></td>
                        <td th:text="${s.maxMarks}"></td>
                        <td th:text="${s.passingMarks}"></td>
                        <td>
                            <a th:href="@{/admin/subjects/delete/{id}(id=${s.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Delete this subject?')">Delete</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
