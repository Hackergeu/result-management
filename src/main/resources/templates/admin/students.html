<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Students</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="sidebar sidebar-admin">
    <div class="sidebar-header">
        <h5>School Result System</h5>
        <p>Admin Panel</p>
    </div>
    <div class="sidebar-nav">
        <a href="/admin/dashboard">Dashboard</a>
        <a href="/admin/classes">Classes</a>
        <a href="/admin/teachers">Teachers</a>
        <a href="/admin/students" class="active">Students</a>
        <a href="/admin/subjects">Subjects</a>
    </div>
    <div class="sidebar-footer">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit">Logout</button>
        </form>
    </div>
</div>

<div class="main-content">
    <div class="page-header">
        <h4>Students</h4>
        <p>Manage student accounts and class assignments.</p>
    </div>
    <div class="row g-4">
        <div class="col-md-4">
            <div class="content-card">
                <div class="content-card-header"><h5>Add New Student</h5></div>
                <div class="content-card-body">
                    <form th:action="@{/admin/students/save}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input name="name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input name="email" type="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input name="password" type="password" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Roll Number</label>
                            <input name="rollNumber" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input name="phone" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Class</label>
                            <select name="classRoomId" class="form-select" required>
                                <option value="">-- Select Class --</option>
                                <option th:each="c : ${classes}"
                                        th:value="${c.id}"
                                        th:text="${c.name + ' ' + c.section}"></option>
                            </select>
                        </div>
                        <button class="btn btn-primary w-100">Add Student</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="content-card">
                <div class="content-card-header"><h5>All Students</h5></div>
                <table class="table">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Roll No</th>
                        <th>Class</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="s, i : ${students}">
                        <td th:text="${i.count}"></td>
                        <td th:text="${s.user.name}"></td>
                        <td th:text="${s.user.email}"></td>
                        <td th:text="${s.rollNumber}"></td>
                        <td th:text="${s.classRoom.name + ' ' + s.classRoom.section}"></td>
                        <td>
                            <a th:href="@{/admin/marksheet/{id}(id=${s.id})}"
                               class="btn btn-primary btn-sm me-1">PDF</a>
                            <a th:href="@{/admin/students/delete/{id}(id=${s.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Delete this student?')">Delete</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
