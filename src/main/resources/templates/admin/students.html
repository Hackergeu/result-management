<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Students</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-dark.css}">
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-logo">🏫</div>
        <div><h5>School System</h5><p>Admin Panel</p></div>
    </div>
    <div class="sidebar-nav">
        <a href="/admin/dashboard"><span class="nav-icon">📊</span> Dashboard</a>
        <a href="/admin/classes"><span class="nav-icon">🏫</span> Classes</a>
        <a href="/admin/teachers"><span class="nav-icon">👨‍🏫</span> Teachers</a>
        <a href="/admin/students" class="active"><span class="nav-icon">🎓</span> Students</a>
        <a href="/admin/subjects"><span class="nav-icon">📚</span> Subjects</a>
    </div>
    <div class="sidebar-footer">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit">🚪 Logout</button>
        </form>
    </div>
</div>

<div class="top-navbar">
    <div class="navbar-left">
        <h6>Students</h6>
        <p>Manage student accounts and class assignments</p>
    </div>
    <div class="navbar-right">
        <div class="admin-profile">
            <div class="admin-avatar">👤</div>
            <span>Admin</span>
        </div>
    </div>
</div>

<div class="main-content">
    <div class="row g-4">

        <!-- Add Student Form -->
        <div class="col-md-4">
            <div class="dark-card">
                <div class="dark-card-header"><h5>➕ Add New Student</h5></div>
                <div class="dark-card-body">
                    <form th:action="@{/admin/students/save}" method="post">
                        <div class="mb-3">
                            <label class="dark-form-label">Full Name</label>
                            <input name="name" class="dark-input" required>
                        </div>
                        <div class="mb-3">
                            <label class="dark-form-label">Email</label>
                            <input name="email" type="email" class="dark-input" required>
                        </div>
                        <div class="mb-3">
                            <label class="dark-form-label">Password</label>
                            <input name="password" type="password" class="dark-input" required>
                        </div>
                        <div class="mb-3">
                            <label class="dark-form-label">Roll Number</label>
                            <input name="rollNumber" class="dark-input" required>
                        </div>
                        <div class="mb-3">
                            <label class="dark-form-label">Phone</label>
                            <input name="phone" class="dark-input">
                        </div>
                        <div class="mb-3">
                            <label class="dark-form-label">Class</label>
                            <select name="classRoomId" class="dark-input" required>
                                <option value="">-- Select Class --</option>
                                <option th:each="c : ${classes}"
                                        th:value="${c.id}"
                                        th:text="${c.name + ' ' + c.section}"></option>
                            </select>
                        </div>
                        <button class="btn-dark-primary">Add Student</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Students Table -->
        <div class="col-md-8">
            <div class="dark-card">
                <div class="dark-card-header">
                    <h5>🎓 All Students</h5>
                    <span style="font-size:12px;color:rgba(255,255,255,0.3);"
                          th:text="${students.size() + ' total'}"></span>
                </div>
                <table class="dark-table">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Student</th>
                        <th>Roll No</th>
                        <th>Class</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="s, i : ${students}">
                        <td style="color:rgba(255,255,255,0.3);"
                            th:text="${i.count}"></td>
                        <td>
                            <div class="student-name-cell">
                                <div class="student-avatar"
                                     th:text="${#strings.substring(s.user.name,0,1)}">
                                </div>
                                <div>
                                    <div th:text="${s.user.name}"
                                         style="color:white;font-weight:500;"></div>
                                    <div th:text="${s.user.email}"
                                         style="font-size:11px;
                                                    color:rgba(255,255,255,0.3);"></div>
                                </div>
                            </div>
                        </td>
                        <td><span class="badge-grade"
                                  th:text="${s.rollNumber}"></span></td>
                        <td th:text="${s.classRoom.name + ' ' + s.classRoom.section}"></td>
                        <td>
                            <a th:href="@{/admin/marksheet/{id}(id=${s.id})}"
                               class="btn-dark-info me-1">PDF</a>
                            <a th:href="@{/admin/students/delete/{id}(id=${s.id})}"
                               class="btn-dark-danger"
                               onclick="return confirm('Delete this student?')">Delete</a>
                        </td>
                    </tr>
                    <tr th:if="${students.isEmpty()}">
                        <td colspan="5">
                            <div class="dark-empty">
                                <div class="empty-icon">📭</div>
                                <p>No students added yet</p>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
