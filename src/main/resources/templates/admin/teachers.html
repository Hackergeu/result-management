<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Teachers</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="sidebar sidebar-admin">
    <div class="sidebar-header">
        <h5>School Result System</h5>
        <p>Admin Panel</p>
    </div>
    <div class="sidebar-nav">
        <a href="/admin/dashboard">Dashboard</a>
        <a href="/admin/classes">Classes</a>
        <a href="/admin/teachers" class="active">Teachers</a>
        <a href="/admin/students">Students</a>
        <a href="/admin/subjects">Subjects</a>
    </div>
    <div class="sidebar-footer">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit">Logout</button>
        </form>
    </div>
</div>

<div class="main-content">
    <div class="page-header">
        <h4>Teachers</h4>
        <p>Manage teacher accounts and department assignments.</p>
    </div>
    <div class="row g-4">
        <div class="col-md-4">
            <div class="content-card">
                <div class="content-card-header"><h5>Add New Teacher</h5></div>
                <div class="content-card-body">
                    <form th:action="@{/admin/teachers/save}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input name="name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input name="email" type="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input name="password" type="password" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Employee Code</label>
                            <input name="employeeCode" class="form-control"
                                   placeholder="e.g. TCH001" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Department</label>
                            <input name="department" class="form-control" required>
                        </div>
                        <button class="btn btn-success w-100">Add Teacher</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="content-card">
                <div class="content-card-header"><h5>All Teachers</h5></div>
                <table class="table">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Employee Code</th>
                        <th>Department</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="t, i : ${teachers}">
                        <td th:text="${i.count}"></td>
                        <td th:text="${t.user.name}"></td>
                        <td th:text="${t.user.email}"></td>
                        <td th:text="${t.employeeCode}"></td>
                        <td th:text="${t.department}"></td>
                        <td>
                            <a th:href="@{/admin/teachers/delete/{id}(id=${t.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Delete this teacher?')">Delete</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
