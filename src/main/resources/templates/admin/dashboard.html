<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar sidebar-admin">
    <div class="sidebar-header">
        <h5>School Result System</h5>
        <p>Admin Panel</p>
    </div>
    <div class="sidebar-nav">
        <a href="/admin/dashboard" class="active">Dashboard</a>
        <a href="/admin/classes">Classes</a>
        <a href="/admin/teachers">Teachers</a>
        <a href="/admin/students">Students</a>
        <a href="/admin/subjects">Subjects</a>
    </div>
    <div class="sidebar-footer">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit">Logout</button>
        </form>
    </div>
</div>

<!-- Main Content -->
<div class="main-content">
    <div class="page-header">
        <h4>Dashboard</h4>
        <p>Welcome back, Admin. Here's what's happening today.</p>
    </div>

    <!-- Stat Cards -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon" style="background:#ede9fe;">🎓</div>
                <div class="stat-info">
                    <h3 th:text="${totalStudents}">0</h3>
                    <p>Total Students</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon" style="background:#d1fae5;">👨‍🏫</div>
                <div class="stat-info">
                    <h3 th:text="${totalTeachers}">0</h3>
                    <p>Total Teachers</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon" style="background:#fef3c7;">🏫</div>
                <div class="stat-info">
                    <h3 th:text="${totalClasses}">0</h3>
                    <p>Total Classes</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon" style="background:#fee2e2;">📚</div>
                <div class="stat-info">
                    <h3 th:text="${totalSubjects}">0</h3>
                    <p>Total Subjects</p>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
